<!DOCTYPE html>
<html>
<head>
    <title>Iframe Loader</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #1e1e2f, #3a3a6a);
            color: white;
            font-family: Arial;
            text-align: center;
        }
        iframe {
            width: 100%;
            height: 95vh;
            border: none;
        }
        #status {
            padding: 10px;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            background: #5a5aff;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="status">Finding working site...</div>
<button onclick="loadSite()">Find Another</button>
<iframe id="frame"></iframe>

<script>
async function loadSite() {
    const status = document.getElementById("status");
    const frame = document.getElementById("frame");

    status.textContent = "Searching...";

    try {
        const res = await fetch("/api/find");
        const data = await res.json();

        if (data.success) {
            status.textContent = "Loaded: " + data.site;
            frame.src = data.site;
        } else {
            status.textContent = "No embeddable sites found.";
        }
    } catch (err) {
        status.textContent = "Error contacting server.";
    }
}

// load on start
loadSite();
</script>

</body>
</html>
